<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timeline Builder with Collections</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body {
            background: #f4f6f8;
            font-family: "Poppins", sans-serif;
            overflow-x: hidden;
        }

        /* wider container to accommodate sidebar */
        .container {
            max-width: 1100px;
            margin-top: 40px;
        }

        /* reset: layout handled by Bootstrap grid */
        .main-content {
            margin-right: 0;
        }

        .timeline {
            position: relative;
            margin-top: 30px;
            padding: 20px 0;
        }

        .timeline::before {
            content: "";
            position: absolute;
            left: 50%;
            width: 3px;
            background: #0d6efd;
            top: 0;
            bottom: 0;
            transform: translateX(-50%);
        }

        /* slightly refined item cards for better UI */
        .timeline-item {
            position: relative;
            width: 50%;
            padding: 15px 25px;
            box-sizing: border-box;
        }

        .timeline-item:nth-child(odd) {
            left: 0;
            text-align: right;
        }

        .timeline-item:nth-child(even) {
            left: 50%;
        }

        .timeline-item::after {
            content: "";
            position: absolute;
            top: 15px;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #0d6efd;
            border: 3px solid #fff;
        }

        .timeline-item:nth-child(odd)::after {
            right: -8px;
        }

        .timeline-item:nth-child(even)::after {
            left: -8px;
        }

        .timeline-item .card,
        .card {
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            margin-bottom: 15px;
        }

        /* nicer sidebar card */
        .sidebar {
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid rgba(13,110,253,0.08);
            box-shadow: 0 6px 18px rgba(13,110,253,0.04);
            padding: 18px;
            overflow: hidden;
        }
        /* make sidebar sticky on large screens so footer flows naturally */
        @media (min-width: 992px) {
            .sidebar.sticky-lg {
                position: sticky;
                top: 20px;
                height: calc(100vh - 40px);
                overflow-y: auto;
            }
        }

        .sidebar h5 {
            text-align: center;
            margin-bottom: 10px;
        }

        /* use list-group look for collections */
        .collection-item {
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 8px;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.05);
            background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
            transition: transform .08s ease, box-shadow .12s ease;
        }
        .collection-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 18px rgba(2,6,23,0.06);
            background: #f8fbff;
        }
        .collection-item .btn {
            margin-left: 6px;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
                border-left: none;
                box-shadow: none;
                margin-left: 0;
            }

            .timeline::before {
                left: 8px;
            }

            .timeline-item {
                width: 100%;
                padding-left: 30px;
            }

            .timeline-item::after {
                left: 0;
            }

            .timeline-item:nth-child(odd),
            .timeline-item:nth-child(even) {
                left: 0;
                text-align: left;
            }
            .main-content {
                margin-right: 0;
            }
        }
        /* footer styling so it sits below everything and looks crisp */
        .site-footer {
            background: #fff;
            border-top: 1px solid rgba(13, 110, 253, 0.12);
            padding: 18px 0;
            margin-top: 32px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row g-4 align-items-start">
            <!-- main content -->
            <div class="col-lg-8">
                <div class="main-content">
                    <h2 class="text-center mb-4">📜 History Timeline</h2>

                    <div class="card p-3 mb-4">
                        <div class="row g-2 align-items-center">
                            <div class="col-md-4">
                                <input id="eventInput" type="text" class="form-control" placeholder="Enter event" />
                            </div>
                            <div class="col-md-3">
                                <input id="yearInput" type="number" class="form-control" placeholder="Year" />
                            </div>
                            <div class="col-md-2">
                                <select id="eraInput" class="form-select">
                                    <option value="CE">CE</option>
                                    <option value="BC">BC</option>
                                </select>
                            </div>
                            <div class="col-md-3 d-grid">
                                <button class="btn btn-primary" id="addBtn">Add</button>
                            </div>
                        </div>
                    </div>

                    <div id="timelineContainer" class="timeline"></div>

                    <div class="text-center mt-3 d-flex justify-content-center gap-2 flex-wrap">
                        <button class="btn btn-success" id="downloadBtn">Download PDF</button>
                        <button class="btn btn-secondary" id="saveBtn">Save Collection</button>
                        <button class="btn btn-outline-primary" id="importBtn">Import JSON</button>
                    </div>

                    <input type="file" id="fileInput" accept=".json" hidden>
                </div>
            </div>

            <!-- Sidebar -->
            <aside class="col-lg-4">
                <div class="sidebar sticky-lg">
                    <h5>📂 Collections</h5>
                    <div id="collectionList" class="d-grid"></div>
                    <hr class="my-3">
                    <div class="text-center">
                        <small class="text-muted">Tip: click Load to view a collection</small>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <script>
        const eventInput = document.getElementById("eventInput");
        const yearInput = document.getElementById("yearInput");
        const eraInput = document.getElementById("eraInput");
        const addBtn = document.getElementById("addBtn");
        const timelineContainer = document.getElementById("timelineContainer");
        const downloadBtn = document.getElementById("downloadBtn");
        const saveBtn = document.getElementById("saveBtn");
        const collectionList = document.getElementById("collectionList");
        const importBtn = document.getElementById("importBtn");
        const fileInput = document.getElementById("fileInput");

        let events = [];

        // Load collections on start
        renderCollections();

        function renderTimeline() {
            timelineContainer.innerHTML = "";
            events.sort((a, b) => {
                const yearA = a.era === "BC" ? -a.year : a.year;
                const yearB = b.era === "BC" ? -b.year : b.year;
                return yearA - yearB;
            });

            events.forEach((item, index) => {
                const div = document.createElement("div");
                div.className = "timeline-item";
                div.innerHTML = `
          <div class="card p-3">
            <h5>${item.year} ${item.era}</h5>
            <p class="mb-2">${item.event}</p>
            <div>
              <button class="btn btn-sm btn-outline-secondary" onclick="editEvent(${index})">Edit</button>
              <button class="btn btn-sm btn-outline-danger" onclick="deleteEvent(${index})">Delete</button>
            </div>
          </div>
        `;
                timelineContainer.appendChild(div);
            });
        }

        addBtn.onclick = () => {
            const event = eventInput.value.trim();
            const year = parseInt(yearInput.value);
            const era = eraInput.value;
            if (!event || !year) return Swal.fire("Error", "Enter both event and year!", "error");
            events.push({ event, year, era });
            eventInput.value = "";
            yearInput.value = "";
            renderTimeline();
        };

        function editEvent(index) {
            Swal.fire({
                title: "Edit Event",
                html: `
          <input id="editEvent" class="swal2-input" value="${events[index].event}">
          <input id="editYear" type="number" class="swal2-input" value="${events[index].year}">
          <select id="editEra" class="swal2-input">
            <option ${events[index].era === "CE" ? "selected" : ""}>CE</option>
            <option ${events[index].era === "BC" ? "selected" : ""}>BC</option>
          </select>
        `,
                confirmButtonText: "Save",
                preConfirm: () => {
                    const newEvent = document.getElementById("editEvent").value;
                    const newYear = parseInt(document.getElementById("editYear").value);
                    const newEra = document.getElementById("editEra").value;
                    if (!newEvent || !newYear) return Swal.showValidationMessage("Please fill all fields");
                    events[index] = { event: newEvent, year: newYear, era: newEra };
                },
            }).then((res) => {
                if (res.isConfirmed) renderTimeline();
            });
        }

        function deleteEvent(index) {
            events.splice(index, 1);
            renderTimeline();
        }

        async function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(16);
            doc.text("Timeline Events", 14, 20);
            let y = 30;
            events.forEach((item) => {
                doc.text(`${item.year} ${item.era} - ${item.event}`, 14, y);
                y += 8;
            });
            doc.save("timeline.pdf");
        }

        downloadBtn.onclick = downloadPDF;

        // Save collection
        saveBtn.onclick = async () => {
            if (events.length === 0) return Swal.fire("Error", "No events to save!", "error");
            const { value: name } = await Swal.fire({
                title: "Save Collection As",
                input: "text",
                inputPlaceholder: "Enter collection name",
                showCancelButton: true,
            });
            if (!name) return;
            localStorage.setItem("timeline_" + name, JSON.stringify(events));
            renderCollections();
            Swal.fire("Saved!", `Collection "${name}" stored locally.`, "success");
        };

        // Render sidebar collections
        function renderCollections() {
            collectionList.innerHTML = "";
            Object.keys(localStorage)
                .filter((key) => key.startsWith("timeline_"))
                .forEach((key) => {
                    const name = key.replace("timeline_", "");
                    const div = document.createElement("div");
                    div.className = "collection-item d-flex justify-content-between align-items-center";
                    div.innerHTML = `
            <span>${name}</span>
            <div>
              <button class="btn btn-sm btn-outline-primary" onclick="loadCollection('${name}')">Load</button>
              <button class="btn btn-sm btn-outline-success" onclick="exportCollection('${name}')">Export</button>
              <button class="btn btn-sm btn-outline-danger" onclick="deleteCollection('${name}')">🗑️</button>
            </div>
          `;
                    collectionList.appendChild(div);
                });
        }

        function loadCollection(name) {
            const data = localStorage.getItem("timeline_" + name);
            if (!data) return;
            events = JSON.parse(data);
            renderTimeline();
            Swal.fire("Loaded", `Collection "${name}" loaded.`, "success");
        }

        function deleteCollection(name) {
            Swal.fire({
                title: `Delete "${name}"?`,
                text: "This cannot be undone.",
                icon: "warning",
                showCancelButton: true,
            }).then((res) => {
                if (res.isConfirmed) {
                    localStorage.removeItem("timeline_" + name);
                    renderCollections();
                }
            });
        }

        function exportCollection(name) {
            const data = localStorage.getItem("timeline_" + name);
            const blob = new Blob([data], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = name + ".json";
            a.click();
            URL.revokeObjectURL(url);
        }

        // Import JSON
        importBtn.onclick = () => fileInput.click();
        fileInput.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const text = await file.text();
            let imported;
            try {
                imported = JSON.parse(text);
            } catch {
                return Swal.fire("Error", "Invalid JSON file!", "error");
            }
            const { value: name } = await Swal.fire({
                title: "Import As",
                input: "text",
                inputPlaceholder: "Enter collection name",
                showCancelButton: true,
            });
            if (!name) return;
            localStorage.setItem("timeline_" + name, JSON.stringify(imported));
            renderCollections();
            Swal.fire("Imported!", `Collection "${name}" added.`, "success");
            e.target.value = "";
        };
    </script>

    <!-- footer placed after all content; full width and inside its own container -->
    <footer class="site-footer">
      <div class="container text-center">
        <p class="mb-1 text-muted small">
          Developed by
          <a href="https://techscription.com" target="_blank" rel="noopener noreferrer" class="text-primary text-decoration-underline">Techscription</a>
        </p>
        <p class="mb-0 text-muted small">
          Powered by
          <a href="https://southarcot.com" target="_blank" rel="noopener noreferrer" class="text-primary text-decoration-underline">South Arcot</a>
        </p>
      </div>
    </footer>
  </body>

</html>
